# Postgres com a extensão pgvector: guarda os currículos (jsonb) e os vetores (halfvec).
# Sobe com `docker compose up -d`. A porta 54370 evita brigar com um Postgres que já rode na 5432.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resumes
    ports:
      - "54370:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Cria também o banco dos testes, resumes_test (só roda quando o volume é novo; ver o README).
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resumes"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
